<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q4 Project</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        body {
            background-color: floralwhite;
            font-family: 'Trebuchet MS', Arial, sans-serif;
        }

        .sidebar{
            position: fixed;
            top: 0;
            left: 0;
            width: 90px;
            height: 100vh;
            background-color: rgb(13, 75, 133);

            display: flex;
            flex-direction: column;
            align-items: center;

            padding-top: 20px;
        }

        .sidebar a{

            width: 60px;
            height: 60px;

            margin: 15px 0;

            display: flex;
            justify-content: center;
            align-items: center;

            border-radius: 15px;

            text-decoration: none;

            color: rgb(76, 201, 245);
            font-size: 28px;

            transition: 0.3s;
        }

        .sidebar a:hover{
            background-color: rgba(255,255,255,0.15);
            color: white;
        }


        .profile-box{
            background-color: white;
            width: 500px;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);

            margin-left: 300px;
            margin-top: 50px;
        }

        h2 {
            color: black;
            font-family: 'Trebuchet MS', Arial, sans-serif;
        }

        .btn-gray {
            background-color: rgb(77, 88, 98);
            color: floralwhite;
        }

        .btn-gray:hover{
            background-color: rgb(55, 65, 75);
            color: white;
        }

        p {
            font-family: 'Trebuchet MS', Arial, sans-serif;
            font-size: 23px;
            font-weight: bold;
            text-align: center;
        }

        label{
            font-size: 17px;
        }

    </style>
</head>

<body>


    <div class="sidebar">

        <a href="dashboard.html" title="Dashboard">
            <i class="bi bi-house"></i>
        </a>

        <a href="notebooks.html" title="Notebooks">
            <i class="bi bi-book"></i>
        </a>

        <a href="tasks.html" title="Tasks">
            <i class="bi bi-check2-square"></i>
        </a>

        <a href="profile.html" title="Profile">
            <i class="bi bi-person"></i>
        </a>

        <a href="index.html" title="Logout">
            <i class="bi bi-box-arrow-right"></i>
        </a>

    </div>


    <div class="profile-box">

        <form>

            <p>PERSONAL INFORMATION</p>

            <label>Student ID: SID123456789</label>

            <br><br>

            <label>Student Name: Michael Luis D. Barrameda</label>

            <br><br>

            <label>Contact Number: 09712345689</label>

            <br><br>

            <label>Email Address: michaelbarrameda@gmail.com</label>

            <br>
            <br>

            <img src="download.png" width="70">

            <br><br>

            <input type="file" accept="image/*" onchange="loadFile(event)">

            <p>
                <img id="output" width="200"/>
            </p>

         <div class="d-grid gap-3">

                <button type="button" class="btn btn-gray">
                    Change Password
                </button>

            </div>

        </form>

    </div>

<script>

function loadFile(event) {

    const image = document.getElementById('output');

    image.src = URL.createObjectURL(event.target.files[0]);
}

</script>

</body>
</html>
