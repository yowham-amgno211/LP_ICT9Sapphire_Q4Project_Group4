<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q4 Project</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"; rel="stylesheet">    

<style>
    body{
        font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
        background-color: rgb(25, 163, 114);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        border: 14px solid floralwhite;
        min-height: 100vh;
        margin: 0;
        box-sizing: border-box;
    }

    .card {
        background: rgba(13, 75, 133);
        padding: 30px;
        border-radius: 20px;
        height: 400px;
        width: 350px;
        align-items: center;
        }

    h2 {
        background-color: rgb(253, 217,95);
        color:rgb(173, 35, 87);
        width: 300px;
        text-align: center;
    }

    label{
        color: rgb(76, 201, 245);
    }


</style>

</head>
<body>
    
<div class="card">
    <h2> Login </h2>
<br>
    <form onsubmit="return authenticate()"> 

        <label>ID Number:</label> 
        <input type="number" id="uname" placeholder="Enter Username" required style="display: block;">

<br><br>

        <label>Password:</label>  
        <input type="password" id="pword" placeholder="Enter Password" required style="display: block;">

<br>

        <label>
        <input type="checkbox"> Stay logged in
        </label>

<br><br>

        <input type="submit" value="Log In"style="background-color:rgb(239, 73, 135); color: floralwhite;" class="w-100">

    </form>

<div id="result"></div>



<script>
let attempts = 3;

function authenticate(){

    var sapphire1 = document.getElementById('uname').value;
    var sapphire2 = document.getElementById('pword').value;

    if(sapphire1 === '123456789' && sapphire2 === 'notmypassword'){
        alert("Welcome " + sapphire1 + "! Login successful.");
        window.location.href = "dashboard.html";
        return false;
    } else {
        attempts--;

        if(attempts > 0){
            alert("Incorrect ID number/password. Attempts left: " + attempts);

            let inputs = document.querySelectorAll("input[type='text'], input[type='password']");
            for(let i = 0; i < inputs.length; i++){
                inputs[i].value = "";
            }

        } else {
            alert("Incorrect ID numbers/usernames. Login locked.");

            document.getElementById('uname').disabled = true;
            document.getElementById('pword').disabled = true;
            document.querySelector('input[type="submit"]').disabled = true;
        }

        return false;
    }
}
</script>



<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
