<style>
        body {
            background-color: floralwhite;

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 90px;
            height: 100vh;
            background-color: rgb(13, 75, 133);
            display: flex;

            justify-content: center;
            align-items: center;
            width: 60px;
            height: 60px;
            text-decoration: none;
            border-radius: 15px;
        }

        .sidebar a:hover {
            background-color: rgba(255,255,255,0.15);
            color: #ffffff;
        }

        .main-content {
            margin-left: 110px;
            padding: 30px;
        }

        .dashboard-title {
            background-color: rgba(255,255,255,0.95);
            text-align: center;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 30px;
        }

        .post-image {
            width: 100%;
            height: 350px;
            object-fit:cover;
        }

        footer {
            text-align: center;
            padding: 20px;
            margin-top: 40px;
            background-color: white;
        }

        .side-box {
    border: 3px solid rgb(13, 75, 133);

}
